name: Caffeine
options:
  bundleIdPrefix: com.tonapps
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Caffeine:
    type: application
    platform: iOS
    sources: [App, Sources, Resources]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Caffeine
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonapps.caffeine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: "NO"
  CaffeineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Caffeine
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Caffeine:
    build:
      targets: {Caffeine: all, CaffeineTests: [test]}
    test:
      targets: [CaffeineTests]
